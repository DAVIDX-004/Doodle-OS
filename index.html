<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>Welcome to Doodle OS</h1>
            <p>Hi! I'm <strong>Muhammad Dawood</strong> — this is my little corner of the internet, built to look like a hand-drawn desktop.</p>
            <button id="enter-btn">Enter DoodleOS →</button>
        </div>
    </div>

    <!-- DESKTOP -->
    <div id="desktop" class="hidden">
        <!-- Desktop Icons -->
        <div class="desktop-icons">
            <div class="desktop-icon" data-app="notepad">
                <div class="icon-draw">📝</div>
                <span>Notepad</span>
            </div>
            <div class="desktop-icon" data-app="terminal">
                <div class="icon-draw">💻</div>
                <span>Terminal</span>
            </div>
            <div class="desktop-icon" data-app="settings">
                <div class="icon-draw">⚙️</div>
                <span>Settings</span>
            </div>
            <div class="desktop-icon" data-app="browser">
                <div class="icon-draw">🌐</div>
                <span>Browser</span>
            </div>
        </div>

        <!-- Windows Container -->
        <div id="windows-container"></div>

        <!-- Taskbar -->
        <div id="taskbar">
            <div class="taskbar-left">
                <button id="start-btn">☰ Start</button>
            </div>
            <div class="taskbar-center" id="taskbar-apps"></div>
            <div class="taskbar-right">
                <div id="clock">12:00 PM</div>
            </div>
        </div>

        <!-- Start Menu -->
        <div id="start-menu" class="hidden">
            <div class="start-header">Doodle OS</div>
            <div class="start-item" data-app="notepad">📝 Notepad</div>
            <div class="start-item" data-app="terminal">💻 Terminal</div>
            <div class="start-item" data-app="settings">⚙️ Settings</div>
            <div class="start-item" data-app="browser">🌐 Browser</div>
            <div class="start-divider"></div>
            <div class="start-item" id="shutdown-btn">⏻ Shut Down</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
